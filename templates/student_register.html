<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Smart Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-header {
            background-color: #0d6efd;
        }
        .btn-register {
            background-color: #198754;
            border-color: #198754;
            font-weight: 600;
        }
        .btn-register:hover {
            background-color: #157347;
            border-color: #146c43;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header text-white text-center py-3">
                    <h5 class="mb-0 fw-bold">Smart Attendance Analysis and Shortage Prediction System</h5>
                </div>
                <div class="card-body p-4 p-md-5">

                    <form method="POST" action="{{ url_for('auth.student_register') }}" onsubmit="return validatePasswords()">

                        <!-- Full Name & Register Number -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="full_name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="register_number" class="form-label">Register Number</label>
                                <input type="text" class="form-control" id="register_number" name="register_number" required>
                            </div>
                        </div>

                        <!-- Email & Phone -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" required>
                            </div>
                        </div>

                        <!-- Department Selection (Full Width since Program is removed) -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-12">
                                <label for="department_id" class="form-label">Department</label>
                                <select class="form-select" id="department_id" name="department_id" required>
                                    <option value="" disabled selected>-- Select Department --</option>
                                    <option value="1">BCA</option>
                                    <option value="2">MCA</option>
                                    <option value="3">M.Sc Computer Science</option>
                                    <option value="4">B.Sc Computer Science</option>
                                </select>
                            </div>
                        </div>

                        <!-- Semester, Academic Year & Section -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="semester" class="form-label">Semester</label>
                                <select class="form-select" id="semester" name="semester" required>
                                    {% for s in range(1, 7) %}
                                        <option value="{{ s }}">Semester {{ s }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="academic_year" class="form-label">Academic Year</label>
                                <input type="text" class="form-control" id="academic_year" name="academic_year" value="2026-2027" required>
                            </div>
                            <div class="col-md-4">
                                <label for="section" class="form-label">Section</label>
                                <input type="text" class="form-control" id="section" name="section" value="A" required>
                            </div>
                        </div>

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>

                        <!-- Show Password Toggle -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePassword()">
                            <label class="form-check-label text-muted" for="showPassword">Show Password</label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-register text-white py-2">
                                <i class="bi bi-check-circle"></i> Register
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted">Already have an account?</span>
                            <a href="{{ url_for('auth.student_login') }}" class="text-primary text-decoration-none fw-bold">Login Here</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
function togglePassword() {
    const pwd = document.getElementById("password");
    const confirmPwd = document.getElementById("confirm_password");
    const isChecked = document.getElementById("showPassword").checked;
    pwd.type = isChecked ? "text" : "password";
    confirmPwd.type = isChecked ? "text" : "password";
}

function validatePasswords() {
    const pwd = document.getElementById("password").value;
    const confirmPwd = document.getElementById("confirm_password").value;
    if (pwd !== confirmPwd) {
        alert("Passwords do not match!");
        return false;
    }
    return true;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
