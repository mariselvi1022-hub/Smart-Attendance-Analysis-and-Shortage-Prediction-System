<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Prediction & What-If Simulator - Smart Attendance</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }
        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .page-title {
            font-weight: 700;
            color: #212529;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .btn-action {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="{{ url_for('auth.student_dashboard') }}">
            🎓 Smart Attendance
        </a>
        <div class="d-flex align-items-center">
            <span class="me-3 text-muted">
                Welcome, <strong>{{ student_name }}</strong>
            </span>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger btn-sm btn-action">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <!-- Header & Dashboard Navigation -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="page-title mb-1">Attendance Prediction & What-If Simulator</h2>
           
        </div>
        <div>
            <a href="{{ url_for('auth.student_dashboard') }}" class="btn btn-secondary btn-action">
                ← Dashboard
            </a>
        </div>
    </div>

    <!-- Simulator Form Card (Centered Layout) -->
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card card-custom">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-sliders"></i> "What-If" Scenario Simulator</h5>
                </div>
                <div class="card-body p-4 bg-white">
                    <form id="simulatorForm" onsubmit="event.preventDefault(); runSimulation();">
                        
                        <div class="mb-3">
                            <label for="sim_subject" class="form-label fw-bold">Select Subject</label>
                            <select id="sim_subject" class="form-select form-select-lg" required>
                                {% if summary %}
                                    <option value="" disabled selected>-- Choose Subject --</option>
                                    {% for row in summary %}
                                    <option value="{{ row.subject_id }}" 
                                            data-present="{{ row.present_classes }}" 
                                            data-total="{{ row.total_classes }}"
                                            data-name="{{ row.subject_name }}">
                                        {{ row.subject_name }} (Current: {{ row.percentage }}%)
                                    </option>
                                    {% endfor %}
                                {% else %}
                                    <option value="" disabled>No Enrolled Subjects Found</option>
                                {% endif %}
                            </select>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="sim_attend" class="form-label fw-bold">Classes to ATTEND</label>
                                <input type="number" id="sim_attend" class="form-control" value="0" min="0" required>
                                <small class="text-muted">Planned present sessions.</small>
                            </div>

                            <div class="col-md-6">
                                <label for="sim_miss" class="form-label fw-bold">Classes to MISS</label>
                                <input type="number" id="sim_miss" class="form-control" value="0" min="0" required>
                                <small class="text-muted">Planned absent sessions.</small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold btn-action mb-2">
                            <i class="bi bi-lightning-charge-fill"></i> Calculate Projected Attendance
                        </button>
                    </form>

                    <!-- Inline Real-Time Result Box (Hidden until calculated) -->
                    <div id="resultState" class="mt-4 pt-3 border-top" style="display: none;">
                        <h6 class="fw-bold text-dark mb-3">
                            <i class="bi bi-graph-up-arrow text-primary"></i> Simulation Outcome for <span id="resSubjectName" class="text-primary"></span>
                        </h6>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <div class="p-3 bg-light rounded-3 border text-center">
                                    <span class="text-muted small fw-bold d-block">PROJECTED ATTENDANCE</span>
                                    <h3 class="fw-bold mt-1 mb-0" id="resPercentage">--%</h3>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 bg-light rounded-3 border text-center">
                                    <span class="text-muted small fw-bold d-block">PROJECTED STATUS</span>
                                    <div class="mt-2">
                                        <span class="badge px-3 py-2 rounded-pill" id="resBadge">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="p-3 rounded-3 border bg-white border-start border-4" id="resAlertBox">
                            <h6 class="fw-bold mb-1" id="resAlertTitle">Analysis</h6>
                            <p class="mb-0 text-secondary small" id="resExplanation">--</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

<script>
function runSimulation() {
    const select = document.getElementById('sim_subject');
    const selectedOption = select.options[select.selectedIndex];
    
    if (!selectedOption || !selectedOption.value) {
        alert("Please select a subject from the list first.");
        return;
    }

    const subjectName = selectedOption.getAttribute('data-name');
    const currentPresent = parseInt(selectedOption.getAttribute('data-present')) || 0;
    const currentTotal = parseInt(selectedOption.getAttribute('data-total')) || 0;

    const attendFuture = parseInt(document.getElementById('sim_attend').value) || 0;
    const missFuture = parseInt(document.getElementById('sim_miss').value) || 0;

    const newPresent = currentPresent + attendFuture;
    const newTotal = currentTotal + attendFuture + missFuture;

    const newPct = newTotal > 0 ? ((newPresent / newTotal) * 100).toFixed(2) : 100.00;

    const resultBox = document.getElementById('resultState');
    resultBox.style.display = 'block';

    document.getElementById('resSubjectName').textContent = subjectName;
    const pctElem = document.getElementById('resPercentage');
    const badgeElem = document.getElementById('resBadge');
    const alertBox = document.getElementById('resAlertBox');
    const alertTitle = document.getElementById('resAlertTitle');
    const expElem = document.getElementById('resExplanation');

    pctElem.textContent = newPct + '%';

    if (parseFloat(newPct) >= 75.0) {
        pctElem.className = 'fw-bold mt-1 mb-0 text-success';
        badgeElem.className = 'badge bg-success px-3 py-2 rounded-pill';
        badgeElem.textContent = 'Eligible (Safe)';
        alertBox.className = 'p-3 rounded-3 border bg-white border-start border-success border-4';
        alertTitle.className = 'fw-bold mb-1 text-success';
        alertTitle.textContent = 'Requirement Met';
        
        const safeMargin = Math.max(0, Math.floor((4 * newPresent - 3 * newTotal) / 3));
        expElem.textContent = `Your projected attendance meets the 75% requirement. Under this scenario, you could safely miss up to ${safeMargin} additional class(es).`;
    } else {
        pctElem.className = 'fw-bold mt-1 mb-0 text-danger';
        badgeElem.className = 'badge bg-danger px-3 py-2 rounded-pill';
        badgeElem.textContent = 'Critical Shortage (<75%)';
        alertBox.className = 'p-3 rounded-3 border bg-white border-start border-danger border-4';
        alertTitle.className = 'fw-bold mb-1 text-danger';
        alertTitle.textContent = 'Shortage Warning';

        const needed = Math.max(0, (3 * newTotal) - (4 * newPresent));
        expElem.textContent = `Under this scenario, your attendance falls below 75%. You would need to attend ${needed} consecutive class(es) without missing any to regain eligibility.`;
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
